name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test_python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,viz]"

    - name: Lint with flake8
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: |
        black --check src/ tests/

    - name: Type check with mypy
      run: |
        mypy src/ --ignore-missing-imports
      continue-on-error: true

    - name: Fetch pinned upstream data for CI only
      run: python ../scripts/fetch_upstream_data.py

    - name: Train development artifact for genuine inference gate
      run: python scripts/train.py --config config/config.quick.yaml

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  web_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json

    - name: Install dependencies
      working-directory: ./apps/web
      run: npm ci

    - name: Lint
      working-directory: ./apps/web
      run: npm run lint

    - name: Test
      working-directory: ./apps/web
      run: npm run test

    - name: Build
      working-directory: ./apps/web
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:8000" # Placeholder for build
        API_KEY: "build-key"

  build_api:
    runs-on: ubuntu-latest
    needs: [test_python, web_test]
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        python scripts/fetch_upstream_data.py
        docker build --build-arg QUICK_TRAIN=1 -f backend/Dockerfile -t heartlens-ai-api:test backend

    - name: Test Docker image
      run: |
        docker run -d -p 127.0.0.1:8000:8000 --name test-api -e APP_ENV=development heartlens-ai-api:test
        sleep 10
        curl -fsS http://localhost:8000/health | python -c 'import json,sys; assert json.load(sys.stdin)["model_loaded"] is True'
        python -c 'import json; from pathlib import Path; p=json.loads(Path("backend/tests/fixtures/same_artifact_prediction.json").read_text()); Path("/tmp/predict.json").write_text(json.dumps(p["request"]))'
        curl -fsS -H 'Content-Type: application/json' -H 'X-API-Key: dev-api-key' --data @/tmp/predict.json http://localhost:8000/predict | python -c 'import json,sys; p=json.load(sys.stdin); assert p["source"] == "model" and 0 <= p["probability"] <= 1'
        docker stop test-api
        docker rm test-api
