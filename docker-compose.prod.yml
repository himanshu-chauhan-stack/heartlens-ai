# Standalone production configuration, NOT a merge overlay.
# docker compose -f docker-compose.prod.yml config
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: cardio
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cardio -d cardio"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_KEY: ${API_KEY:?Set API_KEY}
      DATABASE_URL: postgresql+psycopg://cardio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/cardio
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_URL: http://api:8000
      API_KEY: ${API_KEY:?Set API_KEY}
    depends_on: [api]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
